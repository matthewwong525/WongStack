<!doctype html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Tip calculator</title>
	<link rel="icon" type="image/svg+xml" href="/favicon.svg">
	<link rel="stylesheet" href="/style.css">
	<link rel="stylesheet" href="style.css">
	<script type="module" src="app.js"></script>
</head>
<body>
	<header class="site-header">
		<a class="site-brand" href="/">
			<img class="site-logo" src="/favicon.svg" alt="">
			<span>WongStack</span>
		</a>
	</header>
	<main>
		<h1 class="tips-title">Tip calculator</h1>
		<p class="tips-description">Split a bill and choose a tip.</p>
		<div class="tips-calculator">
			<div class="tips-field">
				<label class="tips-label" for="bill">Bill</label>
				<input class="tips-input" id="bill" type="number" inputmode="decimal" min="0" step="0.01" placeholder="0.00" autofocus>
			</div>
			<div class="tips-field">
				<span class="tips-label" id="tip-label">Tip</span>
				<div class="tips" role="group" aria-labelledby="tip-label">
					<button class="tips-percent" type="button" data-percent="10" aria-pressed="false">10%</button>
					<button class="tips-percent" type="button" data-percent="15" aria-pressed="true">15%</button>
					<button class="tips-percent" type="button" data-percent="18" aria-pressed="false">18%</button>
					<button class="tips-percent" type="button" data-percent="20" aria-pressed="false">20%</button>
				</div>
			</div>
			<div class="tips-field">
				<label class="tips-label" for="people">People</label>
				<input class="tips-input" id="people" type="number" inputmode="numeric" min="1" step="1" value="1">
			</div>
			<output class="tips-result" id="result" aria-live="polite">Enter the bill amount.</output>
		</div>
	</main>
</body>
</html>
