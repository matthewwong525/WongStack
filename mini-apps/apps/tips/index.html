<!doctype html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Tip calculator</title>
	<link rel="stylesheet" href="/style.css">
	<link rel="stylesheet" href="style.css">
	<script type="module" src="app.js"></script>
</head>
<body>
	<p><a href="/">Home</a></p>
	<h1>Tip calculator</h1>

	<label for="bill">Bill</label>
	<input id="bill" type="number" inputmode="decimal" min="0" step="0.01" placeholder="0.00" autofocus>

	<label>Tip</label>
	<div class="tips" role="group" aria-label="Tip">
		<button type="button" data-percent="10">10%</button>
		<button type="button" data-percent="15" aria-pressed="true">15%</button>
		<button type="button" data-percent="18">18%</button>
		<button type="button" data-percent="20">20%</button>
	</div>

	<label for="people">People</label>
	<input id="people" type="number" inputmode="numeric" min="1" step="1" value="1">

	<output id="result" aria-live="polite">Enter the bill amount.</output>
</body>
</html>
