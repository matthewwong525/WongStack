<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer">
<title>Private form</title>
<link rel="stylesheet" href="page.css">
<script src="theme.js"></script>
<style>
  .row { display: flex; gap: 0.5rem; margin-top: 0.75rem; }
  .row:first-child { margin-top: 0; }
  .box { flex: 1; min-width: 0; }
  #does { margin: 0.75rem 0 0; }
</style>
</head>
<body>
<section id="form">
  <p class="private"><svg viewBox="0 0 16 16" aria-hidden="true"><path fill="currentColor" fill-rule="evenodd" d="M4.5 7V5a3.5 3.5 0 0 1 7 0v2h.5A1.5 1.5 0 0 1 13.5 8.5v5A1.5 1.5 0 0 1 12 15H4a1.5 1.5 0 0 1-1.5-1.5v-5A1.5 1.5 0 0 1 4 7h.5zm1.5 0h4V5a2 2 0 0 0-4 0v2z"/></svg>Private link</p>
  <h1>Private form</h1>
  <p class="lead" id="note" hidden></p>
  <p class="promise">Your assistant never sees what you type.</p>
  <div class="picture" id="picture" hidden></div>
  <form id="details">
    <div class="card" id="fields"></div>
    <p class="hint" id="does"></p>
    <div class="actions">
      <button type="submit" class="main" id="send" disabled>Send</button>
      <button type="button" class="quiet" id="done" disabled>Not now</button>
    </div>
    <p class="time" id="time"></p>
  </form>
</section>

<section id="ended" class="end" hidden>
  <h1>This link has closed</h1>
  <p class="hint">Ask your assistant for a new one.</p>
</section>
<p id="status" role="status"></p>
<script type="module" src="picture-view.mjs"></script>
<script type="module" src="page.mjs"></script>
</body>
</html>
