<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer">
<title>Live view</title>
<link rel="stylesheet" href="page.css">
<script src="theme.js"></script>
<style>
  html, body { height: 100%; }
  body { margin: 0; max-width: none; padding: 0; overflow: hidden; }
  #view { display: flex; flex-direction: column; height: 100%; }
  #stage { flex: 1; min-height: 0; display: flex; align-items: flex-start; justify-content: center; background: var(--muted); }
  #holder { overflow: hidden; background: var(--card); touch-action: manipulation; }
  #type { display: flex; gap: 8px; padding: 8px 10px; border-top: 1px solid var(--border); background: var(--background); }
  #status { margin: 24px 16px; color: var(--foreground); font-size: 1.1rem; text-align: left; overflow-wrap: anywhere; }
  #text { flex: 1; min-width: 0; padding: 10px 14px; border-radius: 999px; font-size: 1.05rem; }
</style>
</head>
<body>
<section id="view" hidden>
  <div id="stage"><div id="holder"><div id="screen"></div></div></div>
  <div id="type">
    <input id="text" type="text" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" enterkeyhint="enter" placeholder="Tap a box above, then type here" aria-label="Type into the browser">
    <span data-theme-toggle></span>
  </div>
</section>
<p id="status" role="status">Opening the browser...</p>
<script type="module">
  // The viewer first, then the page: as two tags the page ran before the viewer had loaded. A viewer
  // that fails to load, as on a weak connection, gets two reloads; the key is still in the address.
  try {
    globalThis.RFB = (await import('./novnc/core/rfb.js')).default;
    sessionStorage.removeItem('viewer-tries');
  } catch {
    const tries = Number(sessionStorage.getItem('viewer-tries') ?? 0);
    sessionStorage.setItem('viewer-tries', tries + 1);
    if (tries < 2) location.reload();
  }
  await import('./page.mjs');
</script>
</body>
</html>
