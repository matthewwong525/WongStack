# Meta-only checks on WongStack's own payload. One run per commit:
# see "Why one commit does not test twice" in .github/workflows/test.yml.

name: Payload checks

on:
  push:
  pull_request:

concurrency:
  group: payload-${{ github.event_name }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: ${{ github.ref_name != github.event.repository.default_branch }}

jobs:
  payload:
    if: ${{ github.event_name == 'push' || github.event.pull_request.head.repo.full_name != github.repository }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
        working-directory: app
      - name: Install supported OpenSpec CLI
        run: npm install -g @fission-ai/openspec@1.8.0
      - name: Review assembly and migration fixtures
        run: node --test scripts/tests/*.test.mjs
      - name: Release checks
        run: |
          node scripts/check-payload-links.mjs
          node scripts/check-openspec-config.mjs
