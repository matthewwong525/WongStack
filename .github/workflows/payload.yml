# Meta-only checks on WongStack's own payload. One run per commit:
# see "Why one commit does not test twice" in .github/workflows/test.yml.
#
# When every changed path is under wiki/ or openspec/ (`docs_only` from
# .github/scripts/app-untouched.sh), lint, shellcheck, and the script suite
# skip, and only the private-names test runs from the suite: it scans every
# tracked file, wiki pages included. Markdown anywhere else, skill text
# included, runs everything, and so does a change with no base to compare. The
# release checks always run. The skip happens inside the job, so the required
# `payload` check still reports.

name: Payload checks

on:
  # Branches only: a tag names a commit its branch push already ran, and a
  # tag run would test it again or deploy it to staging under the tag's name.
  push:
    branches: ['**']
  pull_request:

concurrency:
  group: payload-${{ github.event_name }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: ${{ github.ref_name != github.event.repository.default_branch }}

jobs:
  payload:
    if: ${{ github.event_name == 'push' || github.event.pull_request.head.repo.full_name != github.repository }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Check what the change touches
        id: scope
        uses: ./.github/actions/change-scope
        with:
          skip-when: docs_only=true
          skipped-note: 'Only wiki/ or openspec/ changed: lint, shell checks, and the script suite skipped; the private-names test and release checks ran.'
          ran-note: 'Code or skill text changed, or no base to compare: every check ran.'
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: scripts/tests/package-lock.json
      # WongStack's own test dependencies (meta-only; no target receives them).
      - run: npm ci --no-audit --no-fund
        working-directory: scripts/tests
      - name: Install supported OpenSpec CLI
        run: npm install -g @fission-ai/openspec@1.13.2
      - name: Lint scripts
        if: ${{ steps.scope.outputs.docs_only != 'true' }}
        run: scripts/tests/node_modules/.bin/oxlint --deny-warnings scripts .agents/skills/*/scripts .agents/skills/*/worker .github/scripts
      # shellcheck is preinstalled on ubuntu-latest.
      - name: Check shell scripts
        if: ${{ steps.scope.outputs.docs_only != 'true' }}
        run: shellcheck --severity=warning scripts/*.sh .github/scripts/*.sh .agents/skills/*/scripts/*.sh
      # c8 follows the scripts the tests spawn; the floor in .c8rc.json only rises.
      # The review page's browser tests launch the runner's Google Chrome.
      - name: Script tests and coverage
        if: ${{ steps.scope.outputs.docs_only != 'true' }}
        run: scripts/tests/node_modules/.bin/c8 --config scripts/tests/.c8rc.json node --test scripts/tests/*.test.mjs
      # One suite; paired behavior observations use separate source/fixture roots.
      - name: Capture memory areas behavior
        id: memory_capture
        if: ${{ steps.scope.outputs.docs_only != 'true' }}
        timeout-minutes: 2
        env:
          VERIFY_BASELINE_REF: origin/${{ github.event.repository.default_branch }}
        run: node scripts/verify-memory-areas.mjs --out "$RUNNER_TEMP/verify-memory-areas" --baseline-ref "$VERIFY_BASELINE_REF"
      - name: Keep scrubbed memory areas observations
        if: ${{ always() && steps.memory_capture.outcome != 'skipped' && steps.memory_capture.outcome != '' }}
        timeout-minutes: 2
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: verify-memory-areas
          overwrite: true
          path: ${{ runner.temp }}/verify-memory-areas/
          if-no-files-found: error
          retention-days: 14
      - name: Capture retained preflight regression
        id: preflight_regression
        if: ${{ steps.scope.outputs.docs_only != 'true' }}
        timeout-minutes: 2
        run: node scripts/verify-preflight-regression.mjs --out "$RUNNER_TEMP/verify-preflight-regression"
      - name: Keep scrubbed preflight regression observations
        if: ${{ always() && steps.preflight_regression.outcome != 'skipped' && steps.preflight_regression.outcome != '' }}
        timeout-minutes: 2
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: verify-preflight-regression
          overwrite: true
          path: ${{ runner.temp }}/verify-preflight-regression/
          if-no-files-found: error
          retention-days: 14
      - name: Capture retained revision handoff
        id: revision_chain
        if: ${{ steps.scope.outputs.docs_only != 'true' }}
        timeout-minutes: 2
        run: node scripts/verify-revision-chain.mjs --out "$RUNNER_TEMP/verify-revision-chain"
      - name: Keep revision handoff observations
        if: ${{ always() && steps.revision_chain.outcome != 'skipped' && steps.revision_chain.outcome != '' }}
        timeout-minutes: 2
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: verify-revision-chain
          overwrite: true
          path: ${{ runner.temp }}/verify-revision-chain/
          if-no-files-found: error
          retention-days: 14
      # The full suite above already includes it.
      - name: Private-names test
        if: ${{ steps.scope.outputs.docs_only == 'true' }}
        run: node --test scripts/tests/private-names.test.mjs
      - name: Release checks
        run: |
          node scripts/check-payload-links.mjs
          node scripts/check-openspec-config.mjs
          node scripts/check-retired-names.mjs
          openspec validate --specs --strict --no-interactive
          node scripts/measure-context.mjs --check
