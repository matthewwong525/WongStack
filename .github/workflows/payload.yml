# Meta-only checks on WongStack's own payload. One run per commit:
# see "Why one commit does not test twice" in .github/workflows/test.yml.

name: Payload checks

on:
  # Branches only: a tag names a commit its branch push already ran, and a
  # tag run would test it again or deploy it to staging under the tag's name.
  push:
    branches: ['**']
  pull_request:

concurrency:
  group: payload-${{ github.event_name }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: ${{ github.ref_name != github.event.repository.default_branch }}

jobs:
  payload:
    if: ${{ github.event_name == 'push' || github.event.pull_request.head.repo.full_name != github.repository }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: scripts/tests/package-lock.json
      # WongStack's own test dependencies (meta-only; no target receives them).
      - run: npm ci --no-audit --no-fund
        working-directory: scripts/tests
      - name: Install supported OpenSpec CLI
        run: npm install -g @fission-ai/openspec@1.13.2
      - name: Lint scripts
        run: scripts/tests/node_modules/.bin/oxlint --deny-warnings scripts .agents/skills/*/scripts
      # shellcheck is preinstalled on ubuntu-latest.
      - name: Check shell scripts
        run: shellcheck --severity=warning scripts/*.sh .github/scripts/*.sh .agents/skills/*/scripts/*.sh server/*.sh
      # c8 follows the scripts the tests spawn; the floor in .c8rc.json only rises.
      # The review page's browser tests launch the runner's Google Chrome.
      - name: Script tests and coverage
        run: scripts/tests/node_modules/.bin/c8 --config scripts/tests/.c8rc.json node --test scripts/tests/*.test.mjs
      - name: Release checks
        run: |
          node scripts/check-payload-links.mjs
          node scripts/check-openspec-config.mjs
          node scripts/check-retired-names.mjs
          openspec validate --specs --strict --no-interactive
          node scripts/measure-context.mjs --check
