# The repo's own test suite, on every commit — in every repo, on any stack.
#
# This is a CORE payload workflow. It used to be a job inside the Cloudflare
# pack's deploy workflow, which meant a repo that never took the pack had no
# test pipeline at all — the opposite of the intent. Parallelism was never the
# reason it lived there (separate workflows run in parallel too); the reason was
# the double-fire collapse below, which is one copied condition.
#
# `npm test` is the entire contract. Any runner behind that script satisfies
# this job — vitest is what the payload configures by default, not a
# requirement. A repo with no `test` script gets a real check that explains
# itself and passes, never a permanently red one.
#
# The checks themselves live in `.github/scripts/checks.mjs`, not here. A
# hosted workspace has no GitHub Actions, so its runner calls that same script
# at the exact commit: one list, two callers. This workflow keeps what only it
# can do: the checkout and the Node setup.
#
# A change that leaves the main app untouched runs no suite. The script asks
# `.github/scripts/app-untouched.sh`, which compares the whole branch (or, on
# the default branch, the whole push) with its base: when every changed path is
# docs, the main app's checks skip. A mini app is main-app code, so a change to
# one runs the suite. The skip is inside the job, never a `paths-ignore`, so
# the required `test` check still reports. When the comparison can not be made,
# the suite runs. The script writes one summary line either way.
#
# ---------------------------------------------------------------------------
# Why one commit does not test twice
#
# `push` and `pull_request` both fire for a commit on a branch with an open PR.
# The job-level `if` means only `push` — plus pull requests from FORKS, whose
# pushes fire no event in this repo — actually runs; a same-repo PR is already
# covered by its own push event. The concurrency group keys on the EVENT as well
# as the branch for the same reason the deploy workflow does: `github.ref`
# differs between the two triggers, so groups keyed on the branch alone never
# match, and a key that DID match would let one run cancel the other — which
# `gh pr checks` reports as `fail`, blocking /ship.
#
# ---------------------------------------------------------------------------
# Why loosened checks need a reason
#
# Every limit below has an escape hatch: a skip comment, a skipped or deleted
# test, a lowered number in a config. Agents write most of the code, and a
# person who does not read code can not see one being used. The loosened-checks
# check, just before the summary, fails the job when the change uses one and
# its Decision log gives no reason, so a reason is always written where the
# person reads it. wiki/development/the-change-loop.md#the-gate owns the rule.

name: Test

on:
  # Branches only: a tag names a commit its branch push already ran, and a
  # tag run would test it again or deploy it to staging under the tag's name.
  push:
    branches: ['**']
  pull_request:

concurrency:
  group: test-${{ github.event_name }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: ${{ github.ref_name != github.event.repository.default_branch }}

jobs:
  test:
    if: ${{ github.event_name == 'push' || github.event.pull_request.head.repo.full_name != github.repository }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      # Full history: the untouched check compares the whole branch with its base.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      # The check list lives in .github/scripts/checks.mjs, which a hosted
      # workspace's runner calls too, so this workflow names no check of its
      # own. This step runs nothing: it asks where the suite is, so Node is
      # set up with that folder's cache. No suite, or an untouched main app,
      # sets up no Node.
      - name: Plan the checks
        id: plan
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          BEFORE_SHA: ${{ github.event.before }}
        run: node .github/scripts/checks.mjs test --plan >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        if: ${{ steps.plan.outputs.found == 'true' }}
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: ${{ steps.plan.outputs.dir }}/package-lock.json

      # Install and the suite, then the loosened-checks and wiki checks, which
      # run on docs-only changes and after a red suite too, so one push
      # reports everything. It ends with one summary line: what ran, or why
      # nothing did. See "Why loosened checks need a reason" above.
      - name: Run the checks
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          BEFORE_SHA: ${{ github.event.before }}
        run: node .github/scripts/checks.mjs test
