# The repo's own test suite, on every commit — in every repo, on any stack.
#
# This is a CORE payload workflow. It used to be a job inside the Cloudflare
# pack's deploy workflow, which meant a repo that never took the pack had no
# test pipeline at all — the opposite of the intent. Parallelism was never the
# reason it lived there (separate workflows run in parallel too); the reason was
# the double-fire collapse below, which is one copied condition.
#
# `npm test` is the entire contract. Any runner behind that script satisfies
# this job — vitest is what the payload configures by default, not a
# requirement. A repo with no `test` script gets a real check that explains
# itself and passes, never a permanently red one.
#
# A change that leaves the main app untouched runs no suite. The first step,
# `.github/actions/change-scope` (it runs `.github/scripts/app-untouched.sh`),
# compares the whole branch (or, on the default branch, the whole push) with
# its base: when every changed path is docs, the main app's steps skip. A mini
# app is main-app code, so a change to one runs the suite. The skip is inside
# the job, never a `paths-ignore`, so the required
# `test` check still reports. When the comparison can not be made, the suite
# runs. The last step writes one summary line either way.
#
# ---------------------------------------------------------------------------
# Why one commit does not test twice
#
# `push` and `pull_request` both fire for a commit on a branch with an open PR.
# The job-level `if` means only `push` — plus pull requests from FORKS, whose
# pushes fire no event in this repo — actually runs; a same-repo PR is already
# covered by its own push event. The concurrency group keys on the EVENT as well
# as the branch for the same reason the deploy workflow does: `github.ref`
# differs between the two triggers, so groups keyed on the branch alone never
# match, and a key that DID match would let one run cancel the other — which
# `gh pr checks` reports as `fail`, blocking /ship.
#
# ---------------------------------------------------------------------------
# Why loosened checks need a reason
#
# Every limit below has an escape hatch: a skip comment, a skipped or deleted
# test, a lowered number in a config. Agents write most of the code, and a
# person who does not read code can not see one being used. The loosened-checks
# step, just before the summary, fails the job when the change uses one and
# its Decision log gives no reason, so a reason is always written where the
# person reads it. wiki/development/the-change-loop.md#the-gate owns the rule.

name: Test

on:
  # Branches only: a tag names a commit its branch push already ran, and a
  # tag run would test it again or deploy it to staging under the tag's name.
  push:
    branches: ['**']
  pull_request:

concurrency:
  group: test-${{ github.event_name }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: ${{ github.ref_name != github.event.repository.default_branch }}

jobs:
  test:
    if: ${{ github.event_name == 'push' || github.event.pull_request.head.repo.full_name != github.repository }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      # Full history: the untouched check compares the whole branch with its base.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Check what the change touches
        id: scope
        uses: ./.github/actions/change-scope

      # Resolve the app by its test script, never by a stack's config file: a
      # repo can have tests long before it is provisioned, or instead of ever
      # being provisioned. Repo root first, then each immediate subdirectory.
      # Skipped when the main app is untouched. Every main-app step below is
      # gated on this step's `found`, so they skip with it.
      - name: Locate the test suite
        id: suite
        if: ${{ steps.scope.outputs.untouched != 'true' }}
        run: |
          has_test() {
            node -e "process.exit(require('$1/package.json').scripts?.test?0:1)" 2>/dev/null
          }
          FOUND=""
          if [ -f package.json ] && has_test "$PWD"; then
            FOUND="$PWD"
          else
            for dir in */; do
              case "$dir" in node_modules/|.*) continue ;; esac
              if [ -f "$dir/package.json" ] && has_test "$PWD/${dir%/}"; then
                FOUND="$PWD/${dir%/}"; break
              fi
            done
          fi
          if [ -z "$FOUND" ]; then
            echo "found=false" >> "$GITHUB_OUTPUT"
            {
              echo "### No test suite yet"
              echo ""
              echo "No \`package.json\` in this repo declares a \`test\` script,"
              echo "so there is nothing to run."
              echo ""
              echo "Add one — \`/plan\` includes a test task for any change that"
              echo "touches behavior — and this check runs it on every push."
            } >> "$GITHUB_STEP_SUMMARY"
            echo "No test script declared — nothing to run."
            exit 0
          fi
          echo "found=true" >> "$GITHUB_OUTPUT"
          echo "dir=$FOUND" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        if: ${{ steps.suite.outputs.found == 'true' }}
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: ${{ steps.suite.outputs.dir }}/package-lock.json

      - name: Install
        if: ${{ steps.suite.outputs.found == 'true' }}
        working-directory: ${{ steps.suite.outputs.dir }}
        run: npm ci --no-audit --no-fund

      - name: Test
        id: test
        if: ${{ steps.suite.outputs.found == 'true' }}
        working-directory: ${{ steps.suite.outputs.dir }}
        run: npm test

      # Every run that is not cancelled — docs-only ones, and after a red suite,
      # so one push reports everything. A skip comment, a skipped or deleted
      # test, or a changed check setting fails here unless the change's
      # Decision log names the file in a `Check:` bullet. See "Why loosened
      # checks need a reason" above.
      - name: Check for loosened checks
        id: loosened
        if: ${{ !cancelled() }}
        shell: bash
        env:
          BASE: ${{ steps.scope.outputs.base }}
        run: node .github/scripts/loosened-checks.mjs --base "$BASE" | tee -a "$GITHUB_STEP_SUMMARY"

      # Every run that is not cancelled, docs-only ones too: a wiki edit is
      # often all a change is. Fails on a dead link, a page no other wiki page
      # links to, or a hub that skips a page; wiki/wiki-style.md owns the rules.
      - name: Check the wiki's links
        id: wiki
        if: ${{ !cancelled() }}
        shell: bash
        run: node .github/scripts/wiki-links.mjs | tee -a "$GITHUB_STEP_SUMMARY"

      # One line on the run page: what ran, or why nothing did.
      - name: Summary
        if: ${{ !cancelled() }}
        env:
          UNTOUCHED: ${{ steps.scope.outputs.untouched }}
          FOUND: ${{ steps.suite.outputs.found }}
          LOOSENED: ${{ steps.loosened.outcome }}
          WIKI: ${{ steps.wiki.outcome }}
          SUITE: ${{ steps.test.outcome }}
        run: |
          if [ "$UNTOUCHED" = true ]; then
            LINE="The main app is untouched (only docs changed), so its suite did not run."
          elif [ "$FOUND" = true ]; then
            LINE="The main app changed, so its suite ran: $SUITE."
          else
            LINE="The main app changed, but no test suite is declared."
          fi
          [ "$LOOSENED" = failure ] && LINE="$LINE A check was loosened with no written reason; see Loosened checks above."
          [ "$WIKI" = failure ] && LINE="$LINE A wiki link is broken or a page is linked from nowhere; see Wiki links above."
          echo "$LINE" >> "$GITHUB_STEP_SUMMARY"
          echo "$LINE"
