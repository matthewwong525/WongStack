# The repo's own test suite, on every commit — in every repo, on any stack.
#
# This is a CORE payload workflow. It used to be a job inside the Cloudflare
# pack's deploy workflow, which meant a repo that never took the pack had no
# test pipeline at all — the opposite of the intent. Parallelism was never the
# reason it lived there (separate workflows run in parallel too); the reason was
# the double-fire collapse below, which is one copied condition.
#
# `npm test` is the entire contract. Any runner behind that script satisfies
# this job — vitest is what the payload configures by default, not a
# requirement. A repo with no `test` script gets a real check that explains
# itself and passes, never a permanently red one.
#
# A change that leaves the main app untouched runs no suite. The first step,
# `.github/scripts/app-untouched.sh`, compares the whole branch (or, on the
# default branch, the whole push) with its base: when every changed path is
# docs or under `mini-apps/`, the main app's steps skip, and only the changed
# mini apps' own tests run. The skip is inside the job, never a `paths-ignore`,
# so the required `test` check still reports. When the comparison can not be
# made, the suite runs. The last step writes one summary line either way.
#
# ---------------------------------------------------------------------------
# Why one commit does not test twice
#
# `push` and `pull_request` both fire for a commit on a branch with an open PR.
# The job-level `if` means only `push` — plus pull requests from FORKS, whose
# pushes fire no event in this repo — actually runs; a same-repo PR is already
# covered by its own push event. The concurrency group keys on the EVENT as well
# as the branch for the same reason the deploy workflow does: `github.ref`
# differs between the two triggers, so groups keyed on the branch alone never
# match, and a key that DID match would let one run cancel the other — which
# `gh pr checks` reports as `fail`, blocking /ship.
#
# ---------------------------------------------------------------------------
# Why Stryker's result file is cached
#
# Mutation testing is the slow gate, and it grows with the app: a full run
# re-tests every mutant on every push. The scaffold's Stryker config turns on
# incremental mode, which reuses a mutant's result when its code and the test
# that killed it did not change. This job keeps that file between runs. Each
# save gets a new key (entries are immutable); restore matches by prefix, which
# searches this branch first, then the default branch. The key hashes the
# lockfile and the Stryker and Vitest configs, because Stryker's own diff does
# not see them: a dependency or config change must test every mutant again.
# A suite with no Stryker config runs no cache step.

name: Test

on:
  push:
  pull_request:

concurrency:
  group: test-${{ github.event_name }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: ${{ github.ref_name != github.event.repository.default_branch }}

jobs:
  test:
    if: ${{ github.event_name == 'push' || github.event.pull_request.head.repo.full_name != github.repository }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      # Full history: the untouched check compares the whole branch with its base.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0

      - name: Check what the change touches
        id: scope
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          BEFORE_SHA: ${{ github.event.before }}
        run: bash .github/scripts/app-untouched.sh | tee -a "$GITHUB_OUTPUT"

      # Resolve the app by its test script, never by a stack's config file: a
      # repo can have tests long before it is provisioned, or instead of ever
      # being provisioned. Repo root first, then each immediate subdirectory.
      # Skipped when the main app is untouched. Every main-app step below is
      # gated on this step's `found`, so they skip with it.
      - name: Locate the test suite
        id: suite
        if: ${{ steps.scope.outputs.untouched != 'true' }}
        run: |
          has_test() {
            node -e "process.exit(require('$1/package.json').scripts?.test?0:1)" 2>/dev/null
          }
          FOUND=""
          if [ -f package.json ] && has_test "$PWD"; then
            FOUND="$PWD"
          else
            for dir in */; do
              case "$dir" in node_modules/|.*) continue ;; esac
              if [ -f "$dir/package.json" ] && has_test "$PWD/${dir%/}"; then
                FOUND="$PWD/${dir%/}"; break
              fi
            done
          fi
          if [ -z "$FOUND" ]; then
            echo "found=false" >> "$GITHUB_OUTPUT"
            {
              echo "### No test suite yet"
              echo ""
              echo "No \`package.json\` in this repo declares a \`test\` script,"
              echo "so there is nothing to run."
              echo ""
              echo "Add one — \`/plan\` includes a test task for any change that"
              echo "touches behavior — and this check runs it on every push."
            } >> "$GITHUB_STEP_SUMMARY"
            echo "No test script declared — nothing to run."
            exit 0
          fi
          echo "found=true" >> "$GITHUB_OUTPUT"
          echo "dir=$FOUND" >> "$GITHUB_OUTPUT"
          # Cache paths and hashFiles() are workspace-relative: "" at the root, "app/" below it.
          REL="${FOUND#"$PWD"}"; REL="${REL#/}"
          echo "rel=${REL:+$REL/}" >> "$GITHUB_OUTPUT"
          if compgen -G "$FOUND/stryker.conf.*" >/dev/null || compgen -G "$FOUND/stryker.config.*" >/dev/null; then
            echo "stryker=true" >> "$GITHUB_OUTPUT"
            # Inputs Stryker's own diff does not see; a change to any of them starts from no file.
            INPUTS=$(cd "$FOUND" && ls package-lock.json stryker.conf.* stryker.config.* vitest.config.* 2>/dev/null | xargs sha256sum | sha256sum | cut -c1-16)
            echo "stryker-key=stryker-$RUNNER_OS-$INPUTS" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        if: ${{ steps.suite.outputs.found == 'true' }}
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: ${{ steps.suite.outputs.dir }}/package-lock.json

      - name: Install
        if: ${{ steps.suite.outputs.found == 'true' }}
        working-directory: ${{ steps.suite.outputs.dir }}
        run: npm ci

      - name: Install browser for review tests
        if: ${{ steps.suite.outputs.found == 'true' }}
        working-directory: ${{ steps.suite.outputs.dir }}
        run: |
          if node -e "const p=require('./package.json');process.exit(p.devDependencies?.playwright?0:1)"; then
            npx playwright install --with-deps chromium
          fi

      - name: Restore mutation results
        if: ${{ steps.suite.outputs.stryker == 'true' }}
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.suite.outputs.rel }}reports/stryker-incremental.json
          key: ${{ steps.suite.outputs.stryker-key }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: ${{ steps.suite.outputs.stryker-key }}-

      - name: Test
        id: test
        if: ${{ steps.suite.outputs.found == 'true' }}
        working-directory: ${{ steps.suite.outputs.dir }}
        run: npm test

      # Also after a red run, so the fixing push reuses what this one learned.
      - name: Save mutation results
        if: ${{ always() && !cancelled() && steps.suite.outputs.stryker == 'true' && hashFiles(format('{0}reports/stryker-incremental.json', steps.suite.outputs.rel)) != '' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.suite.outputs.rel }}reports/stryker-incremental.json
          key: ${{ steps.suite.outputs.stryker-key }}-${{ github.run_id }}-${{ github.run_attempt }}

      # Each changed mini app's own tests, with Node's built-in runner and no
      # install. They run whenever the change touches a mini app, so a failing
      # test turns this check red, on a direct push to main as on a pull request.
      # Node needs setting up only when the main suite did not already do it.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        if: ${{ steps.scope.outputs.mini_apps != '' && steps.suite.outputs.found != 'true' }}
        with:
          node-version-file: .nvmrc

      # Run from inside each folder: Node's default patterns find the tests
      # there, and Node 22 reads a directory argument as a file.
      - name: Test the changed mini apps
        id: mini
        if: ${{ steps.scope.outputs.mini_apps != '' }}
        env:
          MINI_APPS: ${{ steps.scope.outputs.mini_apps }}
        run: |
          STATUS=0
          TESTED=""
          SKIPPED=""
          for NAME in $MINI_APPS; do
            DIR="mini-apps/apps/$NAME"
            if [ ! -d "$DIR" ]; then
              echo "$NAME: the folder was removed — nothing to test"
              continue
            fi
            if [ -z "$(find "$DIR" -name node_modules -prune -o -type f \( -name '*.test.*' -o -name '*-test.*' -o -name '*_test.*' -o -name 'test.*' -o -name 'test-*' \) -print -quit)" ]; then
              echo "$NAME: no test files — skipped"
              SKIPPED="$SKIPPED $NAME"
              continue
            fi
            echo "::group::$NAME"
            (cd "$DIR" && node --test) || STATUS=1
            echo "::endgroup::"
            TESTED="$TESTED $NAME"
          done
          echo "tested=${TESTED# }" >> "$GITHUB_OUTPUT"
          echo "skipped=${SKIPPED# }" >> "$GITHUB_OUTPUT"
          exit "$STATUS"

      # One line on the run page: what ran, or why nothing did.
      - name: Summary
        if: ${{ !cancelled() }}
        env:
          UNTOUCHED: ${{ steps.scope.outputs.untouched }}
          FOUND: ${{ steps.suite.outputs.found }}
          SUITE: ${{ steps.test.outcome }}
          MINI: ${{ steps.mini.outcome }}
          TESTED: ${{ steps.mini.outputs.tested }}
          SKIPPED: ${{ steps.mini.outputs.skipped }}
        run: |
          if [ "$UNTOUCHED" = true ]; then
            LINE="The main app is untouched (only docs or mini apps changed), so its suite did not run."
          elif [ "$FOUND" = true ]; then
            LINE="The main app changed, so its suite ran: $SUITE."
          else
            LINE="The main app changed, but no test suite is declared."
          fi
          [ -n "$TESTED" ] && LINE="$LINE Mini-app tests ran for $TESTED: $MINI."
          [ -n "$SKIPPED" ] && LINE="$LINE No test files in $SKIPPED."
          echo "$LINE" >> "$GITHUB_STEP_SUMMARY"
          echo "$LINE"
