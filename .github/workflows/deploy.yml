# Cloudflare stack pack — build and deploy when the repo is provisioned.
#
#   build  migrate + build + deploy, green when the repo is unprovisioned;
#          then the mini-app Worker, when mini-apps/ changed
#
# The test suite is NOT here. It runs in the core `test.yml` workflow, which
# every repo receives whether or not it took this pack — so a commit is tested
# once, in parallel with this deploy, and a repo with no Cloudflare account
# still gets a test pipeline. This job never waits on that result: a staging
# deploy of red code is harmless (staging is a fixture and /verify observes it),
# and red code cannot reach production because merges require green CI.
#
# This workflow is a thin driver. The branch logic lives in the pack's scripts,
# exactly as it does under Cloudflare Workers Builds:
#
#   scripts/cf-build.sh   migrate the right database, then build
#   scripts/cf-deploy.sh  default branch → the production Worker
#                         any other      → the staging Worker + a preview alias
#   scripts/cf-mini.sh    the same split for the mini-app Worker (mini-apps/)
#
# The main app deploys only when the change touches it. The first step,
# `.github/scripts/app-untouched.sh` (the same check test.yml runs), compares
# the whole branch — or, on the default branch, the whole push — with its base.
# When every changed path is docs or under `mini-apps/`, every main-app step
# skips and the job says so: a docs branch or a mini-app keep never redeploys
# the main app. The mini-app step has its own condition, `mini-apps/` changed,
# and runs whether or not the main app did.
#
# So both CI backends run identical code, and a repo can switch between them by
# changing where the scripts are invoked from. See wiki/stack/d1-pipeline.md.
#
# An unprovisioned repo gets a real PR check instead of a permanently red one,
# and it does so at two levels:
#
#   - No wrangler config at all — the state the pack SHIPS in, before
#     setup's Cloudflare provisioning writes one. "Locate the app" detects it (cf-build.sh
#     --app-dir exits 3 for exactly this) and the job reports why and stops,
#     green. Every later step is gated on that detection.
#   - Config but no secrets — builds without deploying, as before.
#
# ---------------------------------------------------------------------------
# Why one commit does not deploy twice
#
# `push` and `pull_request` both fire for a commit on a branch with an open PR.
# Collapsing them takes THREE parts, and two are non-obvious:
#
#   1. The concurrency group keys on the EVENT as well as the branch. Keying on
#      the branch alone does not merge the two triggers — `github.ref` is
#      `refs/heads/x` on push and `refs/pull/N/merge` on pull_request, so the
#      groups never matched in the first place. Worse, a key that DID match
#      would make one run cancel the other, and `gh pr checks` reports a
#      cancelled run as `fail`, which blocks /ship. Separate groups, no
#      cancellation between triggers.
#   2. The job-level `if` means only `push` — plus pull requests from FORKS,
#      whose pushes fire no event in this repo — actually runs. A same-repo PR
#      is already covered by its own push event.
#   3. Both are required, because GITHUB EVALUATES CONCURRENCY BEFORE A JOB'S
#      `if`. A run destined to be skipped still enters its concurrency group
#      and can still cancel the run doing the real work. The `if` alone looks
#      correct in testing and races in practice; the group alone leaves the
#      double deploy in place.
#
# `push` stays the deploying event, so the preview URL attaches to the branch
# head SHA — which is the SHA /save and /verify look the preview up by.

name: Deploy

on:
  push:
  pull_request:

# One release per branch PER EVENT — see the header. Let an in-flight production
# deploy finish rather than cancelling it half-applied; previews are cheap, so
# cancel those.
concurrency:
  group: deploy-${{ github.event_name }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: ${{ github.ref_name != github.event.repository.default_branch }}

jobs:
  # The app's own test suite, running BESIDE the build rather than in front of
  # it. Two deliberate properties:
  #
  #   - No `needs:` edge. A staging deploy of red code is harmless — staging is
  #     a seeded fixture and /verify observes it — and red code cannot reach
  #     production anyway, because merging needs green checks. Gating the deploy
  #     on tests would slow every push to buy something the merge gate already
  #     guarantees.
  #   - No test script is GREEN, not red. A repo that hasn't written tests yet
  #     gets a real check that says so, exactly as an unprovisioned repo gets a
  #     real check from the build job. A permanently red check teaches everyone
  #     to ignore it.
  #
  # /save already waits on every check and auto-fixes failures, so the moment
  # this job exists the suite is enforced on every save with no skill logic
  # anywhere. It keys on the `test` script, not on vitest specifically — any
  # runner behind `npm test` satisfies it.
  build:
    # Same-repo pull requests are already covered by their push event; only a
    # fork PR, which fires no push here, needs the pull_request trigger.
    if: ${{ github.event_name == 'push' || github.event.pull_request.head.repo.full_name != github.repository }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # A push to the default branch deploys production, so only that run enters
    # the `production` environment, whose branch policy admits only that
    # branch. Every other run gets no environment. The secrets stay repo-level,
    # so both paths read the same ones.
    environment: ${{ github.event_name == 'push' && github.ref_name == github.event.repository.default_branch && 'production' || '' }}
    permissions:
      contents: read
      # Needed by "Publish the preview URL" — creating a Deployment and its
      # status is the only write this workflow makes to GitHub.
      deployments: write
    env:
      # head_ref is the source branch on pull_request; ref_name is the branch on
      # push. The scripts treat this as "we are in CI" — empty means local, and
      # they then migrate and deploy nothing.
      CF_BRANCH: ${{ github.head_ref || github.ref_name }}
      CF_PRODUCTION_BRANCH: ${{ github.event.repository.default_branch }}
      # The <repo>-deploy token that provisioning minted: Workers Scripts, D1,
      # and Account Settings only. Never the user token, which can mint tokens
      # and stays in the host's .env. See wiki/stack/cloudflare-credentials.md.
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

    steps:
      # Full history: the untouched check compares the whole branch with its base.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Check what the change touches
        id: scope
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          SCOPE=$(bash .github/scripts/app-untouched.sh)
          echo "$SCOPE" | tee -a "$GITHUB_OUTPUT"
          if grep -qx 'untouched=true' <<< "$SCOPE"; then
            echo "The main app is untouched (only docs or mini apps changed), so no main-app migration, build, or deploy ran." >> "$GITHUB_STEP_SUMMARY"
          fi

      # Skipped when the main app is untouched. Every main-app step below —
      # through "Publish the preview URL" — is gated on this step's
      # `configured`, so they skip with it.
      #
      # Exit 3 means "no wrangler config yet" — not a failure, just a repo that
      # has taken the pack and not yet been provisioned. Report it and let every
      # later step skip, so the check is green and says what to do next. Any
      # other non-zero exit is a real error and still fails the job.
      - name: Locate the app
        id: app
        if: ${{ steps.scope.outputs.untouched != 'true' }}
        run: |
          set +e
          DIR=$(bash scripts/cf-build.sh --app-dir)
          STATUS=$?
          set -e
          if [ "$STATUS" -eq 3 ]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            {
              echo "### Not configured yet"
              echo ""
              echo "This repo has the Cloudflare stack pack but no wrangler config,"
              echo "so there is nothing to build or deploy yet."
              echo ""
              echo "Run \`/wong-sync\` to plan Cloudflare provisioning."
            } >> "$GITHUB_STEP_SUMMARY"
            echo "No wrangler config yet — run /wong-sync to plan Cloudflare provisioning."
            exit 0
          fi
          if [ "$STATUS" -ne 0 ]; then
            echo "cf-build.sh --app-dir failed with exit $STATUS" >&2
            exit "$STATUS"
          fi
          echo "configured=true" >> "$GITHUB_OUTPUT"
          echo "dir=$DIR" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        if: ${{ steps.app.outputs.configured == 'true' }}
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: ${{ steps.app.outputs.dir }}/package-lock.json

      - name: Install
        if: ${{ steps.app.outputs.configured == 'true' }}
        working-directory: ${{ steps.app.outputs.dir }}
        run: npm ci

      # Not provisioned yet: build the app directly. Deliberately not through
      # cf-build.sh — that would need a wrangler config with an `env.staging`
      # D1 entry, which a repo that hasn't taken the full pack won't have.
      - name: Build (not provisioned — check only)
        if: ${{ steps.app.outputs.configured == 'true' && env.CLOUDFLARE_API_TOKEN == '' }}
        working-directory: ${{ steps.app.outputs.dir }}
        run: |
          echo "No CLOUDFLARE_API_TOKEN secret — building without deploying."
          echo "Run /wong-sync to plan provisioning, then this job deploys."
          # A wired pack repo has build:app (build is the cf-build.sh wrapper,
          # which would try to migrate). An unwired repo just has build.
          if node -e "process.exit(require('./package.json').scripts?.['build:app']?0:1)"; then
            npm run build:app
          else
            npm run build
          fi

      # Runs before the build so drift is reported even when the build is what
      # breaks. Gated only on there being a config to read: the binding half of
      # the check needs no credential, so a repo with a config and no token
      # still gets that much signal. The script itself skips — never fails — on
      # all three of no token, no config, and no `env.staging`, so this step is
      # safe either way; the `if` just avoids running it with nothing to say.
      - name: Check staging/production parity
        if: ${{ steps.app.outputs.configured == 'true' }}
        run: node scripts/cf-secrets.mjs check

      - name: Build
        if: ${{ steps.app.outputs.configured == 'true' && env.CLOUDFLARE_API_TOKEN != '' }}
        run: bash scripts/cf-build.sh

      - name: Deploy
        id: deploy
        if: ${{ steps.app.outputs.configured == 'true' && env.CLOUDFLARE_API_TOKEN != '' }}
        run: bash scripts/cf-deploy.sh

      # Publish the preview URL where the tooling can find it.
      #
      # Under Cloudflare Workers Builds this step is unnecessary — Cloudflare's
      # own GitHub integration attaches the URL to the commit. Actions has no
      # such integration, so without this the URL exists only in a job log:
      # `/save` reports no preview, and `/verify` — including the evidence step
      # `/ship` runs — reports UNKNOWN because there is nothing to walk against.
      # A GitHub Deployment is what
      # `.claude/skills/save/scripts/preview-url.sh` looks for first.
      #
      # Non-production branches only: the alias URL is per-commit, and the
      # production deploy has a permanent address that needs no announcing.
      - name: Publish the preview URL
        if: ${{ steps.app.outputs.configured == 'true' && env.CLOUDFLARE_API_TOKEN != '' && steps.deploy.outputs.preview-url != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
          PREVIEW_URL: ${{ steps.deploy.outputs.preview-url }}
        run: |
          DEPLOYMENT_ID=$(gh api "repos/$GITHUB_REPOSITORY/deployments" \
            -f ref="$GITHUB_SHA" \
            -f environment=staging \
            -f description="Preview for $CF_BRANCH" \
            -F auto_merge=false \
            -f 'required_contexts[]' \
            --jq .id)
          gh api "repos/$GITHUB_REPOSITORY/deployments/$DEPLOYMENT_ID/statuses" \
            -f state=success \
            -f environment_url="$PREVIEW_URL" \
            --jq .id > /dev/null
          echo "published $PREVIEW_URL as deployment $DEPLOYMENT_ID"

      # ── The mini-app Worker ──────────────────────────────────────────────
      # Only when mini-apps/ changed, and whether or not the main app did.
      # cf-mini.sh deploys the production mini Worker on the default branch,
      # and the staging twin plus a preview alias on any other. It never
      # touches the main app. A repo with no mini-app config stays green.
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        if: ${{ steps.scope.outputs.mini_changed == 'true' && env.CLOUDFLARE_API_TOKEN != '' && steps.app.outputs.configured != 'true' }}
        with:
          node-version-file: .nvmrc

      - name: Deploy the mini apps
        id: mini
        if: ${{ steps.scope.outputs.mini_changed == 'true' && env.CLOUDFLARE_API_TOKEN != '' }}
        env:
          MINI_CHANGED: ${{ steps.scope.outputs.mini_changed }}
        run: bash scripts/cf-mini.sh ci

      # The same publication as the main app's preview, under its own
      # environment name. One Deployment per commit: preview-url.sh takes the
      # first it finds, and /verify must walk the main app when the commit
      # changed it. So when the main app published a preview, the mini-app URL
      # goes in the job summary only.
      - name: Publish the mini-app preview URL
        if: ${{ steps.mini.outputs.preview-url != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
          PREVIEW_URL: ${{ steps.mini.outputs.preview-url }}
          MAIN_PREVIEW_URL: ${{ steps.deploy.outputs.preview-url }}
        run: |
          echo "Mini-app preview: $PREVIEW_URL" >> "$GITHUB_STEP_SUMMARY"
          if [ -n "$MAIN_PREVIEW_URL" ]; then
            echo "The main app published this commit's preview; the mini-app preview is in the job summary."
            exit 0
          fi
          DEPLOYMENT_ID=$(gh api "repos/$GITHUB_REPOSITORY/deployments" \
            -f ref="$GITHUB_SHA" \
            -f environment=staging-mini \
            -f description="Mini-app preview for $CF_BRANCH" \
            -F auto_merge=false \
            -f 'required_contexts[]' \
            --jq .id)
          gh api "repos/$GITHUB_REPOSITORY/deployments/$DEPLOYMENT_ID/statuses" \
            -f state=success \
            -f environment_url="$PREVIEW_URL" \
            --jq .id > /dev/null
          echo "published $PREVIEW_URL as deployment $DEPLOYMENT_ID"
