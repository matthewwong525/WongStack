# Cloudflare stack pack — build, and deploy when the repo is provisioned.
#
# This workflow is a thin driver. The branch logic lives in the pack's scripts,
# exactly as it does under Cloudflare Workers Builds:
#
#   scripts/cf-build.sh   migrate the right database, then build
#   scripts/cf-deploy.sh  default branch → the production Worker
#                         any other      → the staging Worker + a preview alias
#
# So both CI backends run identical code, and a repo can switch between them by
# changing where the scripts are invoked from. See wiki/stack/d1-pipeline.md.
#
# Before /wong-cloudflare has run there are no secrets, so this builds only.
# That is deliberate: an unprovisioned repo gets a real PR check instead of a
# permanently red one.

name: Deploy

on:
  push:
  pull_request:

# One release per branch. Let an in-flight production deploy finish rather than
# cancelling it half-applied; previews are cheap, so cancel those.
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_name != github.event.repository.default_branch }}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Needed by "Publish the preview URL" — creating a Deployment and its
      # status is the only write this workflow makes to GitHub.
      deployments: write
    env:
      # head_ref is the source branch on pull_request; ref_name is the branch on
      # push. The scripts treat this as "we are in CI" — empty means local, and
      # they then migrate and deploy nothing.
      CF_BRANCH: ${{ github.head_ref || github.ref_name }}
      CF_PRODUCTION_BRANCH: ${{ github.event.repository.default_branch }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

    steps:
      - uses: actions/checkout@v4

      - name: Locate the app
        id: app
        run: echo "dir=$(bash scripts/cf-build.sh --app-dir)" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ${{ steps.app.outputs.dir }}/package-lock.json

      - name: Install
        working-directory: ${{ steps.app.outputs.dir }}
        run: npm ci

      # Not provisioned yet: build the app directly. Deliberately not through
      # cf-build.sh — that would need a wrangler config with an `env.staging`
      # D1 entry, which a repo that hasn't taken the full pack won't have.
      - name: Build (not provisioned — check only)
        if: ${{ env.CLOUDFLARE_API_TOKEN == '' }}
        working-directory: ${{ steps.app.outputs.dir }}
        run: |
          echo "No CLOUDFLARE_API_TOKEN secret — building without deploying."
          echo "Run /wong-cloudflare to provision, then this job deploys."
          # A wired pack repo has build:app (build is the cf-build.sh wrapper,
          # which would try to migrate). An unwired repo just has build.
          if node -e "process.exit(require('./package.json').scripts?.['build:app']?0:1)"; then
            npm run build:app
          else
            npm run build
          fi

      # Runs before the build so drift is reported even when the build is what
      # breaks. Deliberately unconditional: the binding half of the check needs
      # no credential, and an unprovisioned repo still gets that much signal.
      # The script skips — never fails — when there is no token, and when the
      # config has no `env.staging` at all.
      - name: Check staging/production parity
        run: node scripts/cf-secrets.mjs check

      - name: Build
        if: ${{ env.CLOUDFLARE_API_TOKEN != '' }}
        run: bash scripts/cf-build.sh

      - name: Deploy
        id: deploy
        if: ${{ env.CLOUDFLARE_API_TOKEN != '' }}
        run: bash scripts/cf-deploy.sh

      # Publish the preview URL where the tooling can find it.
      #
      # Under Cloudflare Workers Builds this step is unnecessary — Cloudflare's
      # own GitHub integration attaches the URL to the commit. Actions has no
      # such integration, so without this the URL exists only in a job log and
      # `/save` reports no preview while `/ship`'s staging walkthrough reports
      # UNKNOWN and refuses to merge. A GitHub Deployment is what
      # `.claude/skills/save/scripts/preview-url.sh` looks for first.
      #
      # Non-production branches only: the alias URL is per-commit, and the
      # production deploy has a permanent address that needs no announcing.
      - name: Publish the preview URL
        if: ${{ env.CLOUDFLARE_API_TOKEN != '' && steps.deploy.outputs.preview-url != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
          PREVIEW_URL: ${{ steps.deploy.outputs.preview-url }}
        run: |
          DEPLOYMENT_ID=$(gh api "repos/$GITHUB_REPOSITORY/deployments" \
            -f ref="$GITHUB_SHA" \
            -f environment=staging \
            -f description="Preview for $CF_BRANCH" \
            -F auto_merge=false \
            -f 'required_contexts[]' \
            --jq .id)
          gh api "repos/$GITHUB_REPOSITORY/deployments/$DEPLOYMENT_ID/statuses" \
            -f state=success \
            -f environment_url="$PREVIEW_URL" \
            --jq .id > /dev/null
          echo "published $PREVIEW_URL as deployment $DEPLOYMENT_ID"
