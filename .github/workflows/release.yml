# Meta-only: tag and publish each WongStack release. scripts/tag-releases.mjs
# creates the tag and GitHub Release for every CHANGELOG.md version that has
# none, so this run labels the new version and fills in any a failed run missed.

name: Releases

on:
  push:
    branches: [main]

concurrency:
  group: releases
  cancel-in-progress: false

jobs:
  releases:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
      - name: Tag and publish missing releases
        run: node scripts/tag-releases.mjs
        env:
          GH_TOKEN: ${{ github.token }}
