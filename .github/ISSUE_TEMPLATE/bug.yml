name: Bug report
description: Something in WongStack does not work as its docs say.
labels: [bug]
body:
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: Include the command you ran and the output or error.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Run /save in a repo with ...
        2. ...
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: WongStack version
      description: The contents of the VERSION file.
      placeholder: 19.0.0
    validations:
      required: true
  - type: dropdown
    id: agent
    attributes:
      label: Agent
      options:
        - Claude Code
        - Codex
        - Other
    validations:
      required: true
