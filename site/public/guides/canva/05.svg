<svg xmlns="http://www.w3.org/2000/svg" width="640" height="256" viewBox="0 0 640 256" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" role="img">
<title>Drawing of Canva's permission screen: AI assistant asks to read your designs, with Allow marked</title>
<rect width="640" height="256" rx="12" fill="#141414"/>
<rect x="0.5" y="0.5" width="639" height="255" rx="12" fill="none" stroke="#333"/>
<circle cx="24" cy="22" r="5" fill="#333"/><circle cx="42" cy="22" r="5" fill="#333"/><circle cx="60" cy="22" r="5" fill="#333"/>
<text x="320" y="27" fill="#a3a3a3" font-size="13" text-anchor="middle">canva.com</text>
<text x="620" y="27" fill="#a3a3a3" font-size="12" text-anchor="end">Drawing</text>
<line x1="0" y1="44" x2="640" y2="44" stroke="#333"/>
<text x="32" y="80" fill="#f5f5f5" font-size="22" font-weight="600">AI assistant wants to access your Canva account</text>
<text x="32" y="114" fill="#a3a3a3" font-size="15" font-weight="400">Read your designs and their titles</text>
<text x="32" y="136" fill="#a3a3a3" font-size="15" font-weight="400">Read your images and videos</text>
<text x="32" y="158" fill="#a3a3a3" font-size="15" font-weight="400">Read your brand templates</text>
<rect x="440" y="182" width="82" height="38" rx="8" fill="none" stroke="#333"/>
<text x="481" y="206" fill="#f5f5f5" font-size="15" font-weight="600" text-anchor="middle">Cancel</text>
<rect x="534" y="182" width="74" height="38" rx="8" fill="#f5f5f5" stroke="#f5f5f5"/>
<text x="571" y="206" fill="#0a0a0a" font-size="15" font-weight="600" text-anchor="middle">Allow</text>
<rect x="528" y="176" width="86" height="50" rx="10" fill="none" stroke="#ff4830" stroke-width="4"/>
</svg>
