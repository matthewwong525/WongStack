<svg xmlns="http://www.w3.org/2000/svg" width="640" height="266" viewBox="0 0 640 266" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" role="img">
<title>Drawing of a Slack channel's message box with /invite @AI assistant typed in it</title>
<rect width="640" height="266" rx="12" fill="#141414"/>
<rect x="0.5" y="0.5" width="639" height="265" rx="12" fill="none" stroke="#333"/>
<circle cx="24" cy="22" r="5" fill="#333"/><circle cx="42" cy="22" r="5" fill="#333"/><circle cx="60" cy="22" r="5" fill="#333"/>
<text x="320" y="27" fill="#a3a3a3" font-size="13" text-anchor="middle">Slack</text>
<text x="620" y="27" fill="#a3a3a3" font-size="12" text-anchor="end">Drawing</text>
<line x1="0" y1="44" x2="640" y2="44" stroke="#333"/>
<text x="32" y="80" fill="#f5f5f5" font-size="22" font-weight="600"># marketing</text>
<text x="32" y="114" fill="#a3a3a3" font-size="15" font-weight="400">Type this in each channel the bot should read:</text>
<text x="32" y="146" fill="#a3a3a3" font-size="13" font-weight="600">Message #marketing</text>
<rect x="32" y="156" width="576" height="40" rx="8" fill="#1f1f1f" stroke="#333"/>
<text x="46" y="182" fill="#f5f5f5" font-size="15" font-weight="400" font-family="ui-monospace, Menlo, monospace">/invite @AI assistant</text>
<rect x="26" y="150" width="588" height="52" rx="10" fill="none" stroke="#ff4830" stroke-width="4"/>
<text x="32" y="224" fill="#a3a3a3" font-size="15" font-weight="400">Slack posts a line that says the app joined the channel.</text>
</svg>
