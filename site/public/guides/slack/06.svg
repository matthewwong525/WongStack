<svg xmlns="http://www.w3.org/2000/svg" width="640" height="370" viewBox="0 0 640 370" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" role="img">
<title>Drawing of Slack's permission screen: AI assistant is asking to access your workspace, with Allow marked</title>
<rect width="640" height="370" rx="12" fill="#141414"/>
<rect x="0.5" y="0.5" width="639" height="369" rx="12" fill="none" stroke="#333"/>
<circle cx="24" cy="22" r="5" fill="#333"/><circle cx="42" cy="22" r="5" fill="#333"/><circle cx="60" cy="22" r="5" fill="#333"/>
<text x="320" y="27" fill="#a3a3a3" font-size="13" text-anchor="middle">slack.com</text>
<text x="620" y="27" fill="#a3a3a3" font-size="12" text-anchor="end">Drawing</text>
<line x1="0" y1="44" x2="640" y2="44" stroke="#333"/>
<text x="32" y="80" fill="#f5f5f5" font-size="22" font-weight="600">AI assistant is asking for permission</text>
<text x="32" y="114" fill="#a3a3a3" font-size="15" font-weight="400">to access your Slack workspace</text>
<text x="32" y="154" fill="#f5f5f5" font-size="16" font-weight="600">What will AI assistant be able to view?</text>
<text x="32" y="182" fill="#a3a3a3" font-size="15" font-weight="400">Content and info about channels</text>
<text x="32" y="204" fill="#a3a3a3" font-size="15" font-weight="400">Content and info about people</text>
<text x="32" y="244" fill="#f5f5f5" font-size="16" font-weight="600">What will AI assistant be able to do?</text>
<text x="32" y="272" fill="#a3a3a3" font-size="15" font-weight="400">Send messages as AI assistant</text>
<rect x="440" y="296" width="82" height="38" rx="8" fill="none" stroke="#333"/>
<text x="481" y="320" fill="#f5f5f5" font-size="15" font-weight="600" text-anchor="middle">Cancel</text>
<rect x="534" y="296" width="74" height="38" rx="8" fill="#f5f5f5" stroke="#f5f5f5"/>
<text x="571" y="320" fill="#0a0a0a" font-size="15" font-weight="600" text-anchor="middle">Allow</text>
<rect x="528" y="290" width="86" height="50" rx="10" fill="none" stroke="#ff4830" stroke-width="4"/>
</svg>
