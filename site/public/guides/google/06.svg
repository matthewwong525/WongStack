<svg xmlns="http://www.w3.org/2000/svg" width="640" height="376" viewBox="0 0 640 376" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" role="img">
<title>Drawing of the Admin console's Add a new client ID window: the Client ID and the read-only scopes typed, and Authorize marked</title>
<rect width="640" height="376" rx="12" fill="#141414"/>
<rect x="0.5" y="0.5" width="639" height="375" rx="12" fill="none" stroke="#333"/>
<circle cx="24" cy="22" r="5" fill="#333"/><circle cx="42" cy="22" r="5" fill="#333"/><circle cx="60" cy="22" r="5" fill="#333"/>
<text x="320" y="27" fill="#a3a3a3" font-size="13" text-anchor="middle">admin.google.com</text>
<text x="620" y="27" fill="#a3a3a3" font-size="12" text-anchor="end">Drawing</text>
<line x1="0" y1="44" x2="640" y2="44" stroke="#333"/>
<text x="32" y="80" fill="#f5f5f5" font-size="22" font-weight="600">Add a new client ID</text>
<text x="32" y="116" fill="#a3a3a3" font-size="13" font-weight="600">Client ID</text>
<rect x="32" y="126" width="576" height="40" rx="8" fill="#1f1f1f" stroke="#333"/>
<text x="46" y="152" fill="#f5f5f5" font-size="15" font-weight="400" font-family="ui-monospace, Menlo, monospace">1234567890…</text>
<text x="32" y="196" fill="#a3a3a3" font-size="13" font-weight="600">OAuth scopes (comma-delimited)</text>
<rect x="32" y="206" width="576" height="40" rx="8" fill="#1f1f1f" stroke="#333"/>
<text x="46" y="232" fill="#f5f5f5" font-size="15" font-weight="400" font-family="ui-monospace, Menlo, monospace">…/auth/gmail.readonly, …/auth/drive.readonly</text>
<rect x="32" y="262" width="16" height="16" rx="3" fill="none" stroke="#a3a3a3"/>
<text x="60" y="275" fill="#a3a3a3" font-size="15" font-weight="400">Overwrite existing client ID</text>
<rect x="406" y="302" width="82" height="38" rx="8" fill="none" stroke="#333"/>
<text x="447" y="326" fill="#f5f5f5" font-size="15" font-weight="600" text-anchor="middle">Cancel</text>
<rect x="500" y="302" width="108" height="38" rx="8" fill="#f5f5f5" stroke="#f5f5f5"/>
<text x="554" y="326" fill="#0a0a0a" font-size="15" font-weight="600" text-anchor="middle">Authorize</text>
<rect x="494" y="296" width="120" height="50" rx="10" fill="none" stroke="#ff4830" stroke-width="4"/>
</svg>
