<svg xmlns="http://www.w3.org/2000/svg" width="640" height="334" viewBox="0 0 640 334" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" role="img">
<title>Drawing of the service account's Keys tab: the Create private key window with JSON chosen and Create marked</title>
<rect width="640" height="334" rx="12" fill="#141414"/>
<rect x="0.5" y="0.5" width="639" height="333" rx="12" fill="none" stroke="#333"/>
