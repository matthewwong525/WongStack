<line x1="0" y1="44" x2="640" y2="44" stroke="#333"/>
<text x="32" y="80" fill="#f5f5f5" font-size="22" font-weight="600">Create private key for "ai-assistant"</text>
<text x="32" y="114" fill="#a3a3a3" font-size="15" font-weight="400">Downloads a file that holds the private key.</text>
<text x="32" y="136" fill="#a3a3a3" font-size="15" font-weight="400">Keep the file safe. You can not get it again.</text>
