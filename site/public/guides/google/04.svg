<rect x="32" y="220" width="16" height="16" rx="3" fill="none" stroke="#a3a3a3"/>
<text x="60" y="233" fill="#a3a3a3" font-size="15" font-weight="400">P12</text>
<rect x="432" y="260" width="82" height="38" rx="8" fill="none" stroke="#333"/>
