<svg xmlns="http://www.w3.org/2000/svg" width="640" height="258" viewBox="0 0 640 258" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" role="img">
<title>Drawing of the Theme Access password page: the password box with its Copy button marked. The password is hidden.</title>
<rect width="640" height="258" rx="12" fill="#141414"/>
<rect x="0.5" y="0.5" width="639" height="257" rx="12" fill="none" stroke="#333"/>
<circle cx="24" cy="22" r="5" fill="#333"/><circle cx="42" cy="22" r="5" fill="#333"/><circle cx="60" cy="22" r="5" fill="#333"/>
<text x="320" y="27" fill="#a3a3a3" font-size="13" text-anchor="middle">theme-access.shopifyapps.com</text>
<text x="620" y="27" fill="#a3a3a3" font-size="12" text-anchor="end">Drawing</text>
<line x1="0" y1="44" x2="640" y2="44" stroke="#333"/>
<text x="32" y="80" fill="#f5f5f5" font-size="22" font-weight="600">Your theme password</text>
<text x="32" y="114" fill="#a3a3a3" font-size="15" font-weight="400">You can see this password one time only.</text>
<text x="32" y="136" fill="#a3a3a3" font-size="15" font-weight="400">Copy it now.</text>
<text x="32" y="168" fill="#a3a3a3" font-size="13" font-weight="600">Password</text>
<rect x="32" y="178" width="480" height="40" rx="8" fill="#1f1f1f" stroke="#333"/>
<text x="46" y="204" fill="#a3a3a3" font-size="15" font-weight="400" font-family="ui-monospace, Menlo, monospace">••••••••••••••••••••••••</text>
<rect x="524" y="179" width="66" height="38" rx="8" fill="#f5f5f5" stroke="#f5f5f5"/>
<text x="557" y="203" fill="#0a0a0a" font-size="15" font-weight="600" text-anchor="middle">Copy</text>
<rect x="518" y="173" width="78" height="50" rx="10" fill="none" stroke="#ff4830" stroke-width="4"/>
</svg>
