schema: spec-driven

# Project context shown to the AI when it drafts change artifacts.
context: |
  WongStack is a stack-agnostic Claude Code workflow toolkit, shipped as a
  template you clone and work from. The payload is markdown: skills under
  .claude/skills/, the wiki/ progressive-disclosure wiki, CLAUDE.md, VERSION,
  CHANGELOG.md. This meta-repo has an app/ test suite that CI runs. CI is the
  gate when checks exist, else PR review is; nothing builds locally either way.

  Planning runs on OpenSpec: a change is openspec/changes/<name>/ (proposal,
  specs, design, tasks). Changes live on the default branch (main) so they are
  visible from any clone; code lives on a feature branch named after the change.
  The WongStack skills own all git — OpenSpec never runs git itself.

  Editing the payload is a release: bump VERSION (semver) and add a newest-first
  CHANGELOG.md entry in the same change.

# Per-artifact rules.
rules:
  proposal:
    - Keep it tight — what changes and why, plus a Non-goals line.
    - Each "What Changes" bullet that has a picture on the change's review page
      ends with its anchor, '(review.html#/<visual>[/<state>][/<mark>])'. The
      state segment is optional; a segment that is not one of the visual's
      states is read as a mark. A bullet with nothing to show carries none.
  design:
    - Every change gets a review page at openspec/changes/<name>/review.html,
      filled from the review kit at .claude/skills/plan/references/review-kit.html —
      one visual per
      "What Changes" bullet that has something to show, of kind screen (a
      low-fidelity UI wireframe with its empty/loading/error states and one
      primary action per state when the job calls for one), flow (connected
      today/after step cards and labeled branches), diff
      (before/after text) or tree (files added/edited/removed). Put data-mark on
      the elements each bullet changes. A bullet with nothing to draw needs no
      visual. The kit shows the complete selected bullet text above the visual.
      Draw no second change list inside it and no link to another bullet.
      Workflow cards keep title, short description, change label, and Details
      within one border. Branches name each condition and their common join.
      Use stable data-target-id values for note targets. Check ordinary
      vertical scrolling at phone and desktop widths. Low fidelity, no network
      reference, and never hand-edit the machine-filled proposal block.
      New kit behavior applies only to newly created review pages; do not
      rewrite existing active or archived review files.
    - If the change adds or meaningfully restructures a user-facing screen (a page
      or component — not merely touching a UI file), also include a "## UX" section
      following wiki/ux-principles.md — use-case brief (who, the job, what done
      looks like, context of use, common vs edge case, stated frequency assumptions),
      the shortest flow from intent to done, hierarchy (the one primary action per
      screen), the component inventory, and a "### Review" subsection linking
      review.html by anchor. Prefer mirroring the closest existing screen; name it
      in the brief. When the brief says the job is done on a phone, draw the phone
      layout first using the kit's phone-only/desktop-only helpers. A UI-less change
      (worker, CLI, library) skips this section and draws no screen visual — it
      still gets the review page.
  tasks:
    - Group tasks by the surface they touch (skill, script, docs, CLAUDE.md).
    - A task that builds or edits something the review page shows cites its
      anchor (e.g. 'Build the list view per review.html#/list/default').
    - A payload change is not done until VERSION and CHANGELOG.md are updated.
