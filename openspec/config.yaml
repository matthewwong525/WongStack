schema: spec-driven

# Project context shown to the AI when it drafts change artifacts.
context: |
  WongStack is a stack-agnostic Claude Code workflow toolkit, shipped as a
  template you clone and work from. The payload is markdown: skills under
  .claude/skills/, the wiki/ progressive-disclosure wiki, CLAUDE.md, VERSION,
  CHANGELOG.md. This meta-repo has app and payload checks in CI. CI is the
  gate when checks exist, else PR review is; nothing builds locally either way.

  Planning runs on OpenSpec: a change is openspec/changes/<name>/ (proposal,
  specs, design, tasks). An active change is saved with its code on a feature
  branch; its archive reaches the default branch after merge. The proposal
  records the actual feature branch. Branch and change names may differ.
  The WongStack skills own all git — OpenSpec never runs git itself.

  Editing the payload is a release: bump VERSION (semver) and add a newest-first
  CHANGELOG.md entry in the same change.

# Per-artifact rules.
rules:
  proposal:
    - Keep it tight — what changes and why, plus a Non-goals line.
    - A What Changes bullet that needs a picture carries it as a fenced text
      block indented inside the bullet, in plain characters, read top to bottom
      and about 40 columns wide. One drawing carries the change by default;
      sketch each new or restructured user-facing screen. Other bullets stay
      text. Bullets carry no review anchors.
    - Each Decision log bullet holds one decision and starts after its date with
      Asked (a question the user answered) or Assumed (an inferred choice and
      its reason), so the review page can label it.
  design:
    - Every change gets a standalone review page at openspec/changes/<name>/review.html,
      built by .claude/skills/plan/scripts/build-review.mjs from the proposal and
      the fixed review kit. The page shows Why, What Changes with their text
      drawings, and the Decision log. Never hand-edit the generated page. Do not
      rewrite historical archives.
    - If the change adds or meaningfully restructures a user-facing screen (a page
      or component — not merely touching a UI file), also include a "## UX" section
      following wiki/ux-principles.md — use-case brief (who, the job, what done
      looks like, context of use, common vs edge case, stated frequency assumptions),
      the shortest flow from intent to done, hierarchy (the one primary action per
      screen), the component inventory, and a "### Review" subsection that links
      review.html and names the What Changes items that sketch each screen, without
      repeating the sketches. Prefer mirroring the closest existing screen; name it
      in the brief. When the brief says the job is done on a phone, sketch the phone
      layout first. A UI-less change (worker, CLI, library) skips this section and
      still gets the review page.
  tasks:
    - Group tasks by the surface they touch (skill, script, docs, CLAUDE.md).
    - A payload change is not done until VERSION and CHANGELOG.md are updated.
